<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NeonFlash - In‑Memory Data Store</title>
    <!-- Vanta.js and Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta/dist/vanta.fog.min.js"></script>
    <!-- React, ReactDOM and Babel -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion/dist/framer-motion.umd.js"></script>
    <style>
      /* Base Styles & Background */
      body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #000;
        color: #e0e0e0;
        line-height: 1.6;
      }
      a {
        color: #00ffff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      /* Container for Vanta background */
      #vanta-bg {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: -1;
      }
      /* Neon Text Effect */
      .neon {
        font-size: 3rem;
        text-align: center;
        color: #00ffff;
        text-shadow:
          0 0 5px #00ffff,
          0 0 10px #00ffff,
          0 0 20px #00ffff,
          0 0 40px #9b30ff,
          0 0 80px #ff69b4,
          0 0 90px #ff69b4;
      }
      /* Additional Neon Flashing (controlled by Framer Motion) */
      .neon-flash {
        opacity: 1;
      }
      /* Container */
      .container {
        max-width: 960px;
        margin: auto;
        padding: 2rem;
      }
      /* Section Headers */
      h1,
      h2,
      h3 {
        border-bottom: 2px solid #00ffff;
        padding-bottom: 0.5rem;
        margin-bottom: 1rem;
      }
      /* Code Blocks */
      pre {
        background: #1a1a1a;
        padding: 1rem;
        border-radius: 5px;
        overflow-x: auto;
        color: #00ffff;
      }
      code {
        font-family: Consolas, Monaco, 'Courier New', monospace;
        color: #ff69b4;
      }
      /* Navigation Menu */
      nav {
        background: rgba(0, 0, 0, 0.8);
        padding: 1rem;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      nav ul {
        list-style: none;
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin: 0;
        padding: 0;
      }
      nav li {
        display: inline;
      }
      /* Footer */
      footer {
        text-align: center;
        margin-top: 2rem;
        padding: 1rem;
        font-size: 0.85rem;
        border-top: 1px solid #00ffff;
      }
      /* Responsive Media */
      @media (max-width: 600px) {
        nav ul {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <!-- Vanta.js dynamic background container -->
    <div id="vanta-bg"></div>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      const { motion } = window["framer-motion"];

      // Main App Component
      function App() {
        const vantaRef = useRef(null);
        const [vantaEffect, setVantaEffect] = useState(0);

        // Initialize Vanta.js fog background on mount
        useEffect(() => {
          if (!vantaEffect) {
            setVantaEffect(
              VANTA.FOG({
                el: "#vanta-bg",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                highlightColor: 0x0,
                midtoneColor: 0x0,
                lowlightColor: 0xff69b4,
                baseColor: 0x0,
                blurFactor: 0.65,
                speed: 1.0,
              })
            );
          }
          return () => {
            if (vantaEffect) vantaEffect.destroy();
          };
        }, [vantaEffect]);

        return (
          <div className="container">
            <Nav />
            <Header />
            <Overview />
            <Features />
            <Installation />
            <Usage />
            <Architecture />
            <Contributing />
            <Footer />
          </div>
        );
      }

      // Navigation Component
      function Nav() {
        return (
          <nav>
            <ul>
              <li><a href="#overview">Overview</a></li>
              <li><a href="#features">Features</a></li>
              <li><a href="#installation">Installation</a></li>
              <li><a href="#usage">Usage</a></li>
              <li><a href="#architecture">Architecture</a></li>
              <li><a href="#contributing">Contributing</a></li>
            </ul>
          </nav>
        );
      }

      // Header Component with Neon Flash using Framer Motion
      function Header() {
        return (
          <header>
            <motion.h1
              className="neon neon-flash"
              animate={{ opacity: [0.6, 1, 0.6] }}
              transition={{ duration: 2, repeat: Infinity, ease: "easeInOut" }}
            >
              NeonFlash
            </motion.h1>
            <p style={{ textAlign: "center" }}>
              A Redis‑inspired in‑memory data store with futuristic neon vibes.
            </p>
          </header>
        );
      }

      // Overview Section
      function Overview() {
        return (
          <section id="overview">
            <h2>Overview</h2>
            <p>
              NeonFlash is a high‑performance, minimalist, in‑memory key‑value store inspired by{" "}
              <a href="https://redis.io" target="_blank" rel="noopener noreferrer">
                Redis
              </a>
              . Written in Go, it sets up a TCP server on port <strong>6379</strong> using the{" "}
              <a
                href="https://redis.io/topics/protocol"
                target="_blank"
                rel="noopener noreferrer"
              >
                RESP
              </a>{" "}
              protocol for communication. The design leverages goroutines and mutexes to handle
              concurrent client connections efficiently.
            </p>
          </section>
        );
      }

      // Features Section with Code Snippet
      function Features() {
        return (
          <section id="features">
            <h2>Features</h2>
            <ul>
              <li>
                <strong>Redis-like Commands:</strong> Supports <code>PING</code>,{" "}
                <code>SET</code>, and <code>GET</code>.
              </li>
              <li>
                <strong>RESP Protocol Handling:</strong> Custom parser and writer for arrays and bulk
                strings.
              </li>
              <li>
                <strong>Concurrent Client Handling:</strong> Uses goroutines to manage multiple
                connections.
              </li>
              <li>
                <strong>In‑memory Data Store:</strong> Global map protected by a read‑write mutex for
                safe concurrent access.
              </li>
              <li>
                <strong>Neon-Themed Logging:</strong> Logs activity with visually appealing neon
                color effects.
              </li>
            </ul>
            <h3>Example: RESP Parsing (Snippet)</h3>
            <pre>
              <code>{`func (r *Resp) Read() (Value, error) {
    _type, err := r.reader.ReadByte()
    if err != nil {
        return Value{}, err
    }
    switch _type {
    case ARRAY:
        return r.readArray()
    case BULK:
        return r.readBulk()
    default:
        fmt.Printf("Unknown type: %v\n", string(_type))
        return Value{}, nil
    }
}`}</code>
            </pre>
          </section>
        );
      }

      // Installation Section with Code Snippet
      function Installation() {
        return (
          <section id="installation">
            <h2>Installation &amp; Setup</h2>
            <h3>Prerequisites</h3>
            <p>You need Go (version 1.16 or later) installed on your system.</p>
            <h3>Clone &amp; Build</h3>
            <pre>
              <code>{`git clone https://github.com/your-username/neonflash.git
cd neonflash
go build -o neonflash
./neonflash`}</code>
            </pre>
            <p>
              <strong>Note:</strong> The server listens on TCP port <code>6379</code>. Make sure your
              firewall settings allow traffic on this port.
            </p>
          </section>
        );
      }

      // Usage Section with Code Snippets
      function Usage() {
        return (
          <section id="usage">
            <h2>Usage</h2>
            <p>
              Interact with NeonFlash using Redis clients like <code>redis-cli</code> or any TCP
              client.
            </p>
            <h3>Ping the server:</h3>
            <pre>
              <code>{`redis-cli -p 6379 ping`}</code>
            </pre>
            <p>Response: <code>PONG</code></p>
            <h3>Set a key-value pair:</h3>
            <pre>
              <code>{`redis-cli -p 6379 set mykey "Hello, Neon World!"`}</code>
            </pre>
            <p>Response: <code>OK</code></p>
            <h3>Get the value of a key:</h3>
            <pre>
              <code>{`redis-cli -p 6379 get mykey`}</code>
            </pre>
            <p>Response: <code>"Hello, Neon World!"</code></p>
          </section>
        );
      }

      // Architecture Section
      function Architecture() {
        return (
          <section id="architecture">
            <h2>Code Architecture</h2>
            <ul>
              <li>
                <strong>Server Initialization:</strong> <code>main.go</code> sets up a TCP listener on
                port <code>6379</code> and handles client connections with separate goroutines.
              </li>
              <li>
                <strong>Connection Handling:</strong> The <code>handleConn</code> function creates a custom
                RESP parser and writer per client.
              </li>
              <li>
                <strong>In‑memory Store:</strong> A global map guarded by a read‑write mutex is used for
                safe concurrent access.
              </li>
              <li>
                <strong>RESP Protocol:</strong> Parsing arrays, bulk strings, and marshaling responses are
                handled in <code>resp.go</code>.
              </li>
              <li>
                <strong>Logging:</strong> Detailed neon‑themed logging helps monitor server activity.
              </li>
            </ul>
          </section>
        );
      }

      // Contributing Section
      function Contributing() {
        return (
          <section id="contributing">
            <h2>Contributing</h2>
            <p>If you'd like to contribute, please follow these steps:</p>
            <ol>
              <li>Fork the repository on GitHub.</li>
              <li>
                Create a feature branch:
                <code> git checkout -b feature/your-feature</code>
              </li>
              <li>
                Commit your changes:
                <code> git commit -m "Add new feature"</code>
              </li>
              <li>
                Push your branch:
                <code> git push origin feature/your-feature</code>
              </li>
              <li>Open a Pull Request with a description of your changes.</li>
            </ol>
            <p>
              See the{" "}
              <a href="CONTRIBUTING.md" target="_blank" rel="noopener noreferrer">
                CONTRIBUTING guidelines
              </a>{" "}
              for more details.
            </p>
          </section>
        );
      }

      // Footer Component
      function Footer() {
        return (
          <footer>
            <p>
              &copy; 2025 NeonFlash. Licensed under the{" "}
              <a href="LICENSE" target="_blank" rel="noopener noreferrer">
                MIT License
              </a>
              .
            </p>
          </footer>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
